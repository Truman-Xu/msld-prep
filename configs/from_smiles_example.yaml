# Example config for `msld_prep_cli.py from-smiles` -- step 1 of 2 (define
# the common core; see build_example.yaml for step 2).
#
# Run with:
#   python msld_prep_cli.py from-smiles --config configs/from_smiles_example.yaml
#
# Any key here can still be overridden on the command line for a one-off
# run, e.g.:
#   python msld_prep_cli.py from-smiles --config configs/from_smiles_example.yaml --work-dir work.override
#
# This particular example reproduces run_msld_prep_from_smiles.py's default
# run: three substituted-phenyl analogs of a quinazoline reference ligand,
# parameterized by a locally-installed standalone CGenFF binary.

# Used only to compute the default work_dir below (work.<sysname>); not
# passed to the pipeline itself.
sysname: fxa_smiles

# Directory with the reference ligand's already-parameterized
# {reference}.mol2/.rtf/.prm.
reference_dir: ../examples/2_ChEMBL
reference: "11896"

# Alternative to reference_dir/reference above: point directly at a single
# .mol2 or .sdf/.mol file (must already carry a real 3D conformer -- every
# analog gets aligned to it) and it's typed via the same streamed local
# CGenFF call the analogs use, instead of requiring pre-existing .rtf/.prm.
# `reference` above is then just an identifier (defaults to the file's
# basename if omitted) rather than a mol2/rtf/prm stem. Mutually exclusive
# with reference_dir -- if both are set, reference_file wins.
# reference_file: ../examples/2_ChEMBL/11896.mol2

# name -> SMILES for every analog to build; add/remove freely.
analog_smiles:
  f_analog: Fc1ccc(Nc2ncnc3ccccc23)cc1
  cl_analog: Clc1ccc(Nc2ncnc3ccccc23)cc1
  me_analog: Cc1ccc(Nc2ncnc3ccccc23)cc1

# Alternative (or supplement) to analog_smiles above: a text file with one
# analog per line, "SMILES [NAME]" (whitespace-separated; '#' comments and
# blank lines are skipped; NAME is auto-generated with a warning if
# omitted). Entries here are merged with analog_smiles, which wins on a
# name clash.
# analog_smiles_file: analogs.smi

# Directory generated analog .mol2/.rtf/.prm files are written into before
# alignment. Default if omitted: work.<sysname>
work_dir: work.fxa_smiles

# Where the human-editable core/site/fragment assignment is written.
# Default if omitted: <work_dir>/MCS_for_MSLD.txt
# checkpoint: work.fxa_smiles/MCS_for_MSLD.txt

# Where each ligand's ALIGNED mol2/rtf/prm is written -- `build` reads
# ligands from here (see from_files_example.yaml's comment for why this
# matters). Default if omitted: <work_dir>/aligned
# aligned_dir: work.fxa_smiles/aligned

# Path to the standalone cgenff binary (not the ParamChem web service).
# Default if omitted: "cgenff" (must then be on PATH).
cgenff_bin: /export/apps/RockyOS8/cgenff/src/2026_May/silcsbio.2026.1/cgenff/cgenff

# CGenFF's own base parameter file, passed as `-p charmm <file>`. Omit to
# skip (cgenff will then rely solely on its own rule-file analogies).
cgenff_base_prm: /export/apps/RockyOS8/cgenff/src/2026_May/silcsbio.2026.1/cgenff/par_all36_cgenff.prm

# Tanimoto/Morgan similarity cutoff for splitting analogs into their own
# core group(s) instead of forcing one global shared core across every
# analog. An analog too structurally different from the reference (and
# from every other leftover analog) gets excluded rather than dragging the
# reference's core down to a tiny fragment -- see msldprep/grouping.py.
# Default if omitted: 0.7. Set to 0 to disable grouping entirely (always
# one global core, matching pre-grouping behavior).
# similarity_threshold: 0.7

log_level: INFO
